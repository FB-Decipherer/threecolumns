<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img"
     aria-label="Map of the Three Columns site family: the class threecolumns.online above, three instances generated from it below. Two of the three are linked in only one direction.">
  <style>
    text{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
    .nm{font-size:19px;font-weight:600;fill:#FFFDFA}
    .rl{font-size:13.5px;font-family:Georgia,serif;fill:#FFFDFA;opacity:.88}
    .cap{font-size:14px;font-family:Georgia,serif;fill:#8A8175}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8175"/>
    </marker>
  </defs>

  <line x1="340" y1="98" x2="340" y2="298" stroke="#8A8175" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="265" y1="98" x2="142" y2="298" stroke="#8A8175" stroke-width="2" marker-end="url(#a)"/>
  <line x1="415" y1="98" x2="538" y2="298" stroke="#8A8175" stroke-width="2" marker-start="url(#a)"/>
  <line x1="245" y1="342" x2="207" y2="342" stroke="#8A8175" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="342" x2="442" y2="342" stroke="#8A8175" stroke-width="2" marker-end="url(#a)"/>

  <rect x="230" y="24" width="220" height="74" rx="4" fill="#4A5A4B"/>
  <text x="340" y="55" text-anchor="middle" class="nm">threecolumns</text>
  <text x="340" y="79" text-anchor="middle" class="rl">the class</text>

  <rect x="10" y="300" width="190" height="84" rx="4" fill="#A8461E"/>
  <text x="105" y="332" text-anchor="middle" class="nm">dog law</text>
  <text x="105" y="356" text-anchor="middle" class="rl">links out: none</text>

  <rect x="245" y="300" width="190" height="84" rx="4" fill="#6B6257"/>
  <text x="340" y="332" text-anchor="middle" class="nm">ciphers</text>
  <text x="340" y="356" text-anchor="middle" class="rl">fully wired</text>

  <rect x="480" y="300" width="190" height="84" rx="4" fill="#A8461E"/>
  <text x="575" y="332" text-anchor="middle" class="nm">washakie</text>
  <text x="575" y="356" text-anchor="middle" class="rl">links in: none</text>

  <text x="340" y="418" text-anchor="middle" class="cap">one class, three instances &#183; rust where a link is missing</text>
</svg>
