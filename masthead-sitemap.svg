<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" role="img"
     aria-label="Map of the Three Columns family: threecolumns.online, the class, at the top; baconian-ciphers.online and washakie-ai.online below it; worland-dog-law.online at the bottom. Arrows show which way the links point between the pages each site lists: the class and washakie-ai.online link to each other, as do washakie-ai.online and worland-dog-law.online; the class also links to the other two, and washakie-ai.online to baconian-ciphers.online.">
  <style>
    text{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
    .nm{font-size:24px;font-weight:600;fill:#FFFDFA}
    .rl{font-size:18px;font-family:Georgia,serif;fill:#FFFDFA;opacity:.9}
    .ln{stroke:#8A8175;stroke-width:2.5;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8175"/>
    </marker>
  </defs>

  <!-- Links. An arrowhead shows which way a link points; two heads, both ways. -->
  <line class="ln" x1="420" y1="100" x2="500" y2="180" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="ln" x1="260" y1="100" x2="180" y2="180" marker-end="url(#a)"/>
  <line class="ln" x1="340" y1="100" x2="340" y2="212"/>
  <line class="ln" x1="340" y1="230" x2="340" y2="342" marker-end="url(#a)"/>
  <line class="ln" x1="458" y1="221" x2="222" y2="221" marker-end="url(#a)"/>
  <line class="ln" x1="500" y1="262" x2="420" y2="342" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="240" y="22" width="200" height="76" rx="4" fill="#4A5A4B"/>
  <text x="340" y="57" text-anchor="middle" class="nm">threecolumns</text>
  <text x="340" y="84" text-anchor="middle" class="rl">the class</text>

  <rect x="20" y="182" width="200" height="78" rx="4" fill="#6B6257"/>
  <text x="120" y="217" text-anchor="middle" class="nm">ciphers</text>
  <text x="120" y="244" text-anchor="middle" class="rl">a running record</text>

  <rect x="460" y="182" width="200" height="78" rx="4" fill="#6B6257"/>
  <text x="560" y="217" text-anchor="middle" class="nm">washakie</text>
  <text x="560" y="244" text-anchor="middle" class="rl">a proposal</text>

  <rect x="240" y="344" width="200" height="78" rx="4" fill="#6B6257"/>
  <text x="340" y="379" text-anchor="middle" class="nm">dog law</text>
  <text x="340" y="406" text-anchor="middle" class="rl">a standing site</text>
</svg>
