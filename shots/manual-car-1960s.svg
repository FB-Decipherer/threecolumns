<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-labelledby="car-t" xmlns:c2pa="http://c2pa.org/manifest">
<title id="car-t">A 1960s-style line drawing of a long, low sedan with tail fins and its hood raised, with three numbered callouts: 1 at the open hood, 2 at the driver's seat, 3 at the fuel filler.</title>
<g fill="none" stroke="#1d1a16" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
  <!-- ground -->
  <line x1="20" y1="214" x2="620" y2="214" stroke-width="1.4" stroke-dasharray="3 5"/>
  <!-- body -->
  <path d="M58 182 L52 160 Q54 146 72 142 L178 134 L238 98 Q252 90 276 90 L392 90 Q414 90 430 100 L486 136 L566 142 Q590 144 598 132 L604 128 L606 160 L600 182 Z"/>
  <!-- belt line and trim -->
  <path d="M70 156 L596 156" stroke-width="1.6"/>
  <path d="M62 170 L600 170" stroke-width="1"/>
  <!-- windows -->
  <path d="M250 134 L282 102 L338 102 L338 134 Z"/>
  <path d="M348 102 L392 102 Q408 102 418 110 L446 134 L348 134 Z"/>
  <!-- tail fin -->
  <path d="M560 142 L600 118 L604 128"/>
  <!-- raised hood -->
  <path d="M74 142 L104 72 L196 96 L178 134" fill="#e9dcc0"/>
  <line x1="128" y1="138" x2="132" y2="86" stroke-width="1.6"/>
  <!-- engine block suggestion -->
  <rect x="96" y="120" width="60" height="16" rx="3" stroke-width="1.6"/>
  <path d="M104 120 v-8 M116 120 v-8 M128 120 v-8 M140 120 v-8" stroke-width="1.4"/>
  <!-- wheels -->
  <circle cx="146" cy="186" r="28" fill="#f2e7cf"/><circle cx="146" cy="186" r="13"/>
  <circle cx="500" cy="186" r="28" fill="#f2e7cf"/><circle cx="500" cy="186" r="13"/>
  <!-- bumpers and lights -->
  <path d="M48 176 L60 176 M596 176 L610 176" stroke-width="4"/>
  <circle cx="60" cy="150" r="5"/>
  <!-- fuel filler -->
  <circle cx="540" cy="150" r="5"/>
  <!-- driver -->
  <circle cx="306" cy="116" r="8"/>
</g>
<!-- callouts -->
<g font-family="Futura,'Century Gothic','Avenir Next',Helvetica,sans-serif" font-weight="700" font-size="15" text-anchor="middle">
  <line x1="150" y1="78" x2="150" y2="34" stroke="#1d1a16" stroke-width="1.2"/>
  <circle cx="150" cy="24" r="13" fill="#1f6f78"/><text x="150" y="29.5" fill="#f2e7cf">1</text>
  <line x1="306" y1="106" x2="306" y2="34" stroke="#1d1a16" stroke-width="1.2"/>
  <circle cx="306" cy="24" r="13" fill="#1f6f78"/><text x="306" y="29.5" fill="#f2e7cf">2</text>
  <line x1="540" y1="144" x2="540" y2="34" stroke="#1d1a16" stroke-width="1.2"/>
  <circle cx="540" cy="24" r="13" fill="#1f6f78"/><text x="540" y="29.5" fill="#f2e7cf">3</text>
</g>
<g font-family="Futura,'Century Gothic','Avenir Next',Helvetica,sans-serif" font-size="12" letter-spacing="1.5" fill="#1d1a16">
  <text x="134" y="29" text-anchor="end">ENGINE</text>
  <text x="328" y="29">ROAD TEST</text>
  <text x="520" y="29" text-anchor="end">FUEL</text>
</g>
<text x="320" y="240" text-anchor="middle" font-family="Futura,'Century Gothic','Avenir Next',Helvetica,sans-serif" font-size="11" letter-spacing="3" fill="#1d1a16">FIG. 1 · YOUR AUTO-GYRO, HOOD RAISED</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
