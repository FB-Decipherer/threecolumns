<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img"
     aria-labelledby="mh-title mh-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="mh-title">Beet ground under the Bighorns</title>
  <desc id="mh-desc">A flat woodcut-style illustration: a low autumn sun over the long silhouette of the Bighorn
  Mountains, a line of cottonwoods along the river, and a beet field whose rows run back to the horizon. Across the
  foreground furrow lie five sugar beets with their leafy tops, lifted and waiting to be hauled.</desc>

  <!--
    Drawn as a woodcut rather than a picture: flat fills, no gradients, and six
    values that step cleanly apart. That is what makes it survive a monochrome
    laser - the composition reads by value alone, nothing relies on hue, and
    there is no large mid-tone field to go patchy in toner.

      sky        #F2EDE2   lightest
      sun        #FFFDF7
      far ridge  #9AA08F
      timber     #6E7865
      near ridge #434B41
      furrows    #C6B79C / #8C7B5F alternating
      beets      #2E2A22   darkest
  -->

  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="680" height="440" rx="3"/></clipPath>
    <clipPath id="fieldclip"><rect x="0" y="243" width="680" height="197"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">

    <!-- ============================ sky ============================ -->
    <rect x="0" y="0" width="680" height="246" fill="#F2EDE2"/>
    <circle cx="486" cy="112" r="46" fill="#FFFDF7"/>
    <!-- three long cloud bars, the flat kind a woodcut would cut -->
    <g fill="#E3DCCB">
      <rect x="60"  y="60"  width="236" height="9"  rx="4.5"/>
      <rect x="104" y="82"  width="158" height="8"  rx="4"/>
      <rect x="392" y="52"  width="214" height="9"  rx="4.5"/>
      <rect x="438" y="168" width="196" height="8"  rx="4"/>
      <rect x="36"  y="150" width="150" height="8"  rx="4"/>
    </g>

    <!-- ===================== the Bighorn front =====================
         One long wall seen broadside, two ranks. Flat fills, no snow
         confetti: the high ground is drawn by shape, not by decoration. -->
    <path fill="#9AA08F" d="M0 192 L54 170 L96 182 L142 142 L186 164 L232 124 L286 156
      L330 140 L382 166 L430 130 L478 158 L524 144 L574 170 L622 152 L680 178 L680 250 L0 250 Z"/>
    <path fill="#434B41" d="M0 214 L48 198 L92 208 L136 180 L178 200 L224 170 L272 196
      L318 182 L366 204 L412 176 L458 200 L506 188 L554 210 L602 194 L648 208 L680 200
      L680 252 L0 252 Z"/>

    <!-- river timber: one cut band of flat trees -->
    <g fill="#6E7865">
      <rect x="0" y="243" width="680" height="12"/>
      <g>
        <circle cx="26"  cy="243" r="13"/><circle cx="52"  cy="246" r="10"/>
        <circle cx="96"  cy="242" r="14"/><circle cx="126" cy="246" r="10"/>
        <circle cx="168" cy="243" r="12"/><circle cx="196" cy="246" r="9"/>
        <circle cx="242" cy="241" r="15"/><circle cx="276" cy="245" r="10"/>
        <circle cx="318" cy="243" r="12"/><circle cx="346" cy="246" r="9"/>
        <circle cx="392" cy="242" r="14"/><circle cx="424" cy="245" r="10"/>
        <circle cx="468" cy="243" r="12"/><circle cx="496" cy="246" r="9"/>
        <circle cx="540" cy="241" r="15"/><circle cx="574" cy="245" r="10"/>
        <circle cx="618" cy="243" r="13"/><circle cx="650" cy="246" r="10"/>
      </g>
    </g>

    <!-- ============================ field ============================
         Alternating light and dark furrows, all converging on one point
         on the horizon. Cut as wedges, which is how a block would do it. -->
    <g clip-path="url(#fieldclip)">
      <rect x="0" y="243" width="680" height="197" fill="#C6B79C"/>
      <g fill="#8C7B5F">
        <path d="M404 252 L246 440 L86 440 Z"/>
        <path d="M414 252 L368 440 L300 440 Z"/>
        <path d="M421 252 L452 440 L516 440 Z"/>
        <path d="M427 252 L596 440 L680 440 L680 414 Z"/>
        <path d="M398 252 L96 348 L0 372 L0 330 Z"/>
        <path d="M432 252 L620 300 L680 316 L680 288 Z"/>
      </g>
      <!-- the furrow lines themselves, fine and dark, same vanishing point -->
      <g stroke="#5E5342" fill="none" stroke-linecap="round">
        <path d="M416 250 L-40 440"  stroke-width="1.6"/>
        <path d="M416 250 L120 440"  stroke-width="1.8"/>
        <path d="M416 250 L272 440"  stroke-width="2"/>
        <path d="M416 250 L402 440"  stroke-width="2"/>
        <path d="M416 250 L540 440"  stroke-width="2"/>
        <path d="M416 250 L700 440"  stroke-width="1.8"/>
        <path d="M416 250 L-40 356"  stroke-width="1.4"/>
        <path d="M416 250 L720 322"  stroke-width="1.4"/>
      </g>
    </g>

    <!-- near headland: one dark band to sit the foreground on -->
    <path fill="#6B5E49" d="M0 364 Q180 352 350 362 Q520 372 680 360 L680 440 L0 440 Z"/>
    <path fill="#554B3A" d="M0 386 Q180 374 350 384 Q520 394 680 382 L680 440 L0 440 Z"/>

    <!-- ===================== five lifted beets =====================
         The actual subject of the harvest, drawn large enough to be read
         at a glance: root, crown, and the leaf top still on. -->
    <g fill="#2E2A22">
      <!-- 1 -->
      <g transform="translate(78,392)">
        <path d="M0 0 q17 -3 25 10 q6 11 -3 20 q-11 11 -24 4 q-13 -8 -11 -20 q2 -10 13 -14 z"/>
        <path d="M22 -2 q10 -22 28 -26 q-9 14 -17 29 z"/>
        <path d="M14 -4 q-2 -24 11 -34 q-2 18 1 33 z"/>
        <path d="M6 -2 q-14 -17 -10 -31 q7 14 17 27 z"/>
        <path d="M-6 22 q-12 9 -22 8 q10 -7 19 -13 z"/>
      </g>
      <!-- 2 -->
      <g transform="translate(190,406)">
        <path d="M0 0 q18 -4 26 10 q6 12 -4 21 q-12 11 -25 3 q-13 -8 -10 -21 q2 -9 13 -13 z"/>
        <path d="M23 -3 q12 -20 30 -23 q-11 13 -19 27 z"/>
        <path d="M13 -5 q-3 -25 12 -35 q-3 19 0 34 z"/>
        <path d="M5 -3 q-16 -15 -13 -30 q8 14 19 26 z"/>
      </g>
      <!-- 3 -->
      <g transform="translate(316,396)">
        <path d="M0 0 q19 -3 27 11 q6 12 -4 21 q-12 11 -26 3 q-13 -9 -10 -22 q3 -9 13 -13 z"/>
        <path d="M24 -2 q11 -23 30 -27 q-11 15 -19 30 z"/>
        <path d="M14 -5 q-2 -26 13 -36 q-3 19 0 35 z"/>
        <path d="M5 -3 q-15 -16 -12 -31 q8 15 18 27 z"/>
        <path d="M-7 23 q-13 10 -24 9 q11 -8 21 -14 z"/>
      </g>
      <!-- 4 -->
      <g transform="translate(442,410)">
        <path d="M0 0 q17 -3 25 10 q6 11 -3 20 q-11 11 -24 3 q-12 -8 -10 -20 q2 -9 12 -13 z"/>
        <path d="M22 -2 q10 -21 28 -25 q-10 14 -17 28 z"/>
        <path d="M13 -4 q-2 -24 11 -33 q-2 18 1 32 z"/>
        <path d="M5 -2 q-14 -15 -11 -29 q7 13 17 25 z"/>
      </g>
      <!-- 5 -->
      <g transform="translate(560,394)">
        <path d="M0 0 q19 -4 27 11 q7 12 -4 22 q-12 11 -26 3 q-14 -9 -10 -22 q3 -10 13 -14 z"/>
        <path d="M24 -3 q12 -23 31 -27 q-11 15 -20 30 z"/>
        <path d="M14 -5 q-3 -27 13 -37 q-3 20 0 36 z"/>
        <path d="M5 -3 q-16 -16 -13 -32 q9 15 19 28 z"/>
        <path d="M-7 24 q-14 10 -25 9 q12 -8 22 -15 z"/>
      </g>
    </g>
  </g>
</svg>
