<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" width="440" height="520" role="img"
     aria-labelledby="p-title p-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="p-title">Placeholder for the student's photograph</title>
  <desc id="p-desc">A drawn stand-in, not a photograph of anyone. A plain portrait mount with corner marks holds a
  simple figure in flat silhouette — head and shoulders, no face — against a field and the Bighorn Mountains, in the
  same woodcut style as the other pictures in this family.</desc>

  <!--
    Deliberately not a face. This page is a demonstration with an invented
    student, so the portrait must read as "a real photograph goes here" and
    must never be mistaken for a picture of a person. Hence: no features, the
    corner marks of a photo mount, and the same flat value steps as the rest
    of the family so it prints on a monochrome laser.
  -->

  <defs>
    <clipPath id="mount"><rect x="34" y="34" width="372" height="414" rx="4"/></clipPath>
  </defs>

  <rect x="0" y="0" width="440" height="520" fill="#F2EDE2"/>

  <g clip-path="url(#mount)">
    <!-- sky -->
    <rect x="34" y="34" width="372" height="414" fill="#E6E2D6"/>

    <!-- the range, same two ranks as the family's other pictures -->
    <path fill="#9AA08F" d="M34 244 L78 216 L116 230 L158 196 L198 222 L240 192 L286 224
                            L330 204 L372 230 L406 212 L406 300 L34 300 Z"/>
    <path fill="#434B41" d="M34 266 L74 248 L114 258 L156 232 L196 254 L238 228 L284 256
                            L328 240 L370 262 L406 246 L406 316 L34 316 Z"/>

    <!-- field, with the converging rows of the masthead, smaller -->
    <rect x="34" y="306" width="372" height="142" fill="#C6B79C"/>
    <g fill="#8C7B5F">
      <path d="M236 310 L150 448 L74 448 Z"/>
      <path d="M248 310 L286 448 L352 448 Z"/>
      <path d="M232 310 L60 352 L34 362 L34 336 Z"/>
    </g>
    <g stroke="#5E5342" fill="none" stroke-linecap="round" stroke-width="1.4">
      <path d="M242 308 L14 448"/><path d="M242 308 L128 448"/>
      <path d="M242 308 L248 448"/><path d="M242 308 L372 448"/>
      <path d="M242 308 L470 440"/>
    </g>
    <path fill="#6B5E49" d="M34 406 Q220 396 406 404 L406 448 L34 448 Z"/>

    <!-- the figure: head and shoulders, flat, no features.
         Order matters: shoulders, then neck, then head, then the hat on top,
         so each shape sits in front of the one behind it. -->
    <g fill="#2E2A22">
      <!-- shoulders and chest, running off the bottom of the mount as a portrait does -->
      <path d="M220 286
               q-46 0 -78 24
               q-30 23 -38 62
               l-12 76 l256 0 l-12 -76
               q-8 -39 -38 -62
               q-32 -24 -78 -24 z"/>
      <!-- neck -->
      <path d="M200 252 h40 v34 q-20 10 -40 0 z"/>
      <!-- head -->
      <ellipse cx="220" cy="214" rx="44" ry="52"/>
      <!-- ears, which stop the head reading as an egg -->
      <ellipse cx="174" cy="216" rx="7" ry="11"/>
      <ellipse cx="266" cy="216" rx="7" ry="11"/>
      <!-- hat: crown then brim, the brim last so it sits over the head -->
      <path d="M220 136 q-34 0 -38 26 l-5 34 l86 0 l-5 -34 q-4 -26 -38 -26 z"/>
      <path d="M220 182 q-58 0 -86 12 q-9 4 -1 8 q30 13 87 13 q57 0 87 -13 q8 -4 -1 -8
               q-28 -12 -86 -12 z"/>
    </g>
    <!-- collar and yoke, light, so the torso does not read as one dark blob -->
    <g fill="#E6E2D6">
      <path d="M220 290 l-19 22 l19 20 l19 -20 z"/>
      <path d="M146 326 q34 -22 74 -22 q40 0 74 22 l-7 10 q-31 -19 -67 -19 q-36 0 -67 19 z"
            opacity="0.5"/>
    </g>
  </g>

  <!-- the mount: a thin rule, then corner marks, so it reads as a photo position -->
  <rect x="34" y="34" width="372" height="414" rx="4" fill="none" stroke="#B9B2A2" stroke-width="1.5"/>
  <g stroke="#8A8372" stroke-width="2.4" fill="none" stroke-linecap="square">
    <path d="M22 54 v-22 h22"/>
    <path d="M396 32 h22 v22"/>
    <path d="M418 428 v22 h-22"/>
    <path d="M44 450 h-22 v-22"/>
  </g>

  <text x="220" y="488" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="15" letter-spacing="1.4" fill="#6E6757">PHOTOGRAPH GOES HERE</text>
  <text x="220" y="508" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="14" fill="#8A8372">drawn, not photographed &#8212; this student does not exist</text>
</svg>
